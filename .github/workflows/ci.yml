name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel an older run when new commits arrive on the same branch or pull request
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # `bun run mcp:setup <tool> --agent-key` writes MCP config for unattended runs, which
      # drops the prompt before Stripe tool calls. Committed, it would drop it for everyone.
      # This searches the commit, so a later job that runs --agent-key isn't affected.
      - name: Committed MCP config doesn't use the Stripe agent key
        run: |
          if git grep -n STRIPE_AGENT_API_KEY HEAD -- .mcp.json .claude .cursor .vscode .kiro .codex .gemini; then
            echo "::error::Committed MCP config uses STRIPE_AGENT_API_KEY. Run bun run mcp:setup <tool> without --agent-key and commit that instead."
            exit 1
          fi

      # The Bun adapter requires Bun 1.4 or newer
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      # vite preview and the Playwright runner run on Node. SvelteKit 3 needs Node 22.17+
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test:unit

      - name: Every acceptance criterion has a test
        run: bun run test:criteria

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Acceptance tests
        run: bun run test:acceptance

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
