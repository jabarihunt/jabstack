name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel an older run when new commits arrive on the same branch or pull request
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The Bun adapter requires Bun 1.4 or newer
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      # vite preview and the Playwright runner run on Node. SvelteKit 3 needs Node 22.17+
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test:unit

      - name: Every acceptance criterion has a test
        run: bun run test:criteria

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Acceptance tests
        run: bun run test:acceptance

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
